{% set title = 'Forgot Password (Boxed)' %}

{% extends 'src/layouts/auth.html' %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-100 m-0 py-5 px-3">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
        <div class="text-center mb-4">
            <a href="index.html"><img src="assets/static/images/logo/logo.svg" alt="Logo" height="32"></a>
        </div>
        <div class="card shadow-sm mb-4">
            <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-light-primary p-3 mb-3">
                        <i class="bi bi-key fs-3 bi-middle lh-1 w-auto h-auto"></i>
                    </div>
                    <h3 class="mb-2">Forgot password?</h3>
                    <p class="text-muted mb-0">Enter the email linked to your account and we will send you a link to reset your password.</p>
                </div>

                <form action="auth-login-boxed.html">
                    <div class="mb-4">
                        <label for="forgot-email" class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope bi-middle lh-1"></i></span>
                            <input type="email" class="form-control" id="forgot-email" placeholder="name@example.com" autocomplete="email">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">Send reset link</button>
                </form>

                <div class="text-center mt-4">
                    <a href="auth-login-boxed.html" class="font-bold"><i class="bi bi-arrow-left bi-middle me-1"></i>Back to log in</a>
                </div>
            </div>
        </div>
        <p class="text-center text-muted mb-0">Don't have an account? <a href="auth-register-boxed.html" class="font-bold">Sign up</a></p>
    </div>
</div>
{% endblock %}
